services:
  db:
    image: "mysql:8.4"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: root
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      retries: 10

  rr_db:
    image: "mysql:8.4"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rr_govwifi
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      retries: 10

  logging_api_rr_db_migrate:
    build: ./mysql
    environment:
      DB_HOSTNAME: rr_db
      DB_NAME: rr_govwifi
      DB_USER: root
      DB_PASS: root
    depends_on:
      rr_db:
        condition: service_healthy

  wifi_user_db:
    build: ./mysql_user
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wifi_user_govwifi
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        BUNDLE_INSTALL_FLAGS: "${BUNDLE_INSTALL_FLAGS:- --jobs 20 --retry 5}"
    depends_on:
      db:
        condition: service_healthy
      logging_api_rr_db_migrate:
        condition: service_completed_successfully
      wifi_user_db:
        condition: service_healthy
    expose:
      - "3000"
